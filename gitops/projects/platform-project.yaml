apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform project for all application deployments

  sourceRepos:
    - https://github.com/hknisci/k8s-creating_cluster_with_ansible
    - https://charts.bitnami.com/bitnami
    - https://helm.releases.hashicorp.com

  destinations:
    - namespace: dev-*
      server: https://kubernetes.default.svc
    - namespace: staging-*
      server: https://kubernetes.default.svc
    - namespace: prod-*
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: keda
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: keda.sh
      kind: TriggerAuthentication
    - group: kyverno.io
      kind: ClusterPolicy

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  roles:
    - name: dev-deployer
      description: Can sync dev applications
      policies:
        - p, proj:platform:dev-deployer, applications, sync, platform/nodejs-express-dev, allow
        - p, proj:platform:dev-deployer, applications, get, platform/nodejs-express-dev, allow
      groups:
        - dev-team
    - name: platform-admin
      description: Full access to platform project
      policies:
        - p, proj:platform:platform-admin, applications, *, platform/*, allow
      groups:
        - platform-team
