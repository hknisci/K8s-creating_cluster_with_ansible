# This file is for reference only.
# The actual secret is managed via External Secrets Operator.
# Secret value is stored in GCP Secret Manager: argocd/slack-webhook-url
#
# The ExternalSecret below syncs from GCP Secret Manager to a Kubernetes Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: slack-token
      remoteRef:
        key: argocd/slack-token
