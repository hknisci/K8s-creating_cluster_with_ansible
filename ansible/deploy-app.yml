---
# Application deployment playbook - called by Jenkins deploy pipeline
# Usage: ansible-playbook ansible/deploy-app.yml -e "image_tag=abc1234 docker_user=myuser"
- name: Deploy application to Kubernetes
  hosts: master
  become: false
  vars:
    image_tag: "latest"
    docker_user: "dreamgames"
    app_namespace: "app"
    manifest_dir: "kubernetes/app"

  tasks:
    - name: Update image tag in deployment
      replace:
        path: "{{ manifest_dir }}/deployment.yaml"
        regexp: 'image: {{ docker_user }}/query-param-app:.*'
        replace: "image: {{ docker_user }}/query-param-app:{{ image_tag }}"
      delegate_to: localhost

    - name: Apply namespace
      command: kubectl apply -f {{ manifest_dir }}/namespace.yaml
      environment:
        KUBECONFIG: "/home/{{ node_user | default('ubuntu') }}/.kube/config"

    - name: Apply application manifests
      command: kubectl apply -f {{ manifest_dir }}/
      environment:
        KUBECONFIG: "/home/{{ node_user | default('ubuntu') }}/.kube/config"

    - name: Wait for rollout to complete
      command: >
        kubectl rollout status deployment/query-param-app
        -n {{ app_namespace }} --timeout=300s
      environment:
        KUBECONFIG: "/home/{{ node_user | default('ubuntu') }}/.kube/config"
