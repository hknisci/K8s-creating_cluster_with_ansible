# Step 3.2: Scheduled autoscaling with KEDA CronTrigger
# Scale out BEFORE peak hours, scale in AFTER
# helm install keda kedacore/keda -n keda --create-namespace
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: query-param-app-scheduled
  namespace: app
spec:
  scaleTargetRef:
    name: query-param-app
  minReplicaCount: 4
  maxReplicaCount: 16
  cooldownPeriod: 300
  triggers:
    # Scale out to 12 replicas at 08:45 (15 min before 09:00 peak)
    - type: cron
      metadata:
        timezone: "Europe/Istanbul"
        start: "45 8 * * 1-5"
        end:   "00 18 * * 1-5"
        desiredReplicas: "12"
    # Scale out further at 12:45 (lunch peak)
    - type: cron
      metadata:
        timezone: "Europe/Istanbul"
        start: "45 12 * * 1-5"
        end:   "30 14 * * 1-5"
        desiredReplicas: "16"
    # CPU-based scaling always active as safety net
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
