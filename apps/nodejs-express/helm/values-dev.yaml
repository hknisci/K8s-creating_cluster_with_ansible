replicaCount: 1

image:
  tag: "latest"
  pullPolicy: Always

ingress:
  hosts:
    - host: app.dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-dev-tls-secret
      hosts:
        - app.dev.example.com

resources:
  limits:
    cpu: 300m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3

pdb:
  enabled: false

env:
  NODE_ENV: development
  LOG_LEVEL: debug

externalSecret:
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: nodejs-express-dev/database-url
    - secretKey: API_KEY
      remoteRef:
        key: nodejs-express-dev/api-key
