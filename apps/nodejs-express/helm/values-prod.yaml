replicaCount: 3

image:
  tag: "1.0.0"
  pullPolicy: IfNotPresent

ingress:
  hosts:
    - host: app.prod.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-prod-tls-secret
      hosts:
        - app.prod.example.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

pdb:
  enabled: true
  minAvailable: 2

keda:
  enabled: true
  pubsub:
    subscriptionName: nodejs-express-prod-sub
    projectId: "PROJECT_ID"
    threshold: "50"
    minReplicas: 3
    maxReplicas: 20
    cooldownPeriod: 60
    pollingInterval: 30

env:
  NODE_ENV: production
  LOG_LEVEL: warn

topologySpreadConstraints:
  enabled: true

externalSecret:
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: nodejs-express-prod/database-url
    - secretKey: API_KEY
      remoteRef:
        key: nodejs-express-prod/api-key
