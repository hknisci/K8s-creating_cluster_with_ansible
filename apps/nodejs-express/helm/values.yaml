replicaCount: 2

image:
  repository: europe-west1-docker.pkg.dev/PROJECT_ID/nodejs-express/app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "3000"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-tls-secret
      hosts:
        - app.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health/ready
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

keda:
  enabled: false
  pubsub:
    subscriptionName: ""
    projectId: ""
    threshold: "50"
    minReplicas: 2
    maxReplicas: 20
    cooldownPeriod: 60
    pollingInterval: 30

env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: "3000"

envFromSecret: []

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreName: gcp-secret-store
  secretStoreKind: ClusterSecretStore
  target:
    name: nodejs-express-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: nodejs-express/database-url
    - secretKey: API_KEY
      remoteRef:
        key: nodejs-express/api-key

configmap:
  enabled: true
  data:
    APP_NAME: nodejs-express-app

networkPolicy:
  enabled: true

topologySpreadConstraints:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
