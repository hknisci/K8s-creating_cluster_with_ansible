{{- if .Values.configmap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nodejs-express.fullname" . }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "nodejs-express.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configmap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
