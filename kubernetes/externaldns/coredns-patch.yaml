# Patch CoreDNS ConfigMap to enable etcd backend for ExternalDNS
# kubectl patch configmap coredns -n kube-system --patch "$(cat coredns-patch.yaml)"
# Note: This enables the etcd plugin so ExternalDNS can write DNS records
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        etcd example.com {
          stubzones
          path /skydns
          endpoint http://localhost:2379
        }
        prometheus :9153
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
