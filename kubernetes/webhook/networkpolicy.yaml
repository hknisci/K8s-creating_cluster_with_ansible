apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resource-webhook
  namespace: webhook-system
spec:
  podSelector:
    matchLabels:
      app: resource-webhook
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webhook-system
      ports:
        - protocol: TCP
          port: 443
