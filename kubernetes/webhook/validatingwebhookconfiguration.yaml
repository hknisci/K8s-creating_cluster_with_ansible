apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: resource-requests-webhook
  annotations:
    # After running tls/generate-certs.sh, patch caBundle:
    # CA_BUNDLE=$(kubectl get secret resource-webhook-tls -n webhook-system \
    #   -o jsonpath='{.data.ca\.crt}')
    # kubectl patch validatingwebhookconfiguration resource-requests-webhook \
    #   --type='json' -p="[{'op':'replace','path':'/webhooks/0/clientConfig/caBundle','value':'${CA_BUNDLE}'}]"
webhooks:
  - name: resource-requests.dreamgames.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    namespaceSelector:
      matchExpressions:
        - key: name
          operator: In
          values:
            - app
            - production
            - staging
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: Namespaced
    clientConfig:
      service:
        name: resource-webhook
        namespace: webhook-system
        path: /validate
        port: 443
      # Populated by generate-certs.sh — see annotation above
      caBundle: ""
    timeoutSeconds: 10
