# Install ECK Operator (Elastic Cloud on Kubernetes)
# kubectl create -f https://download.elastic.co/downloads/eck/2.11.1/crds.yaml
# kubectl apply -f https://download.elastic.co/downloads/eck/2.11.1/operator.yaml
#
# Reference: This is the elasticsearch cluster CR applied after the operator is up
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: monitoring
spec:
  version: 8.12.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        # xpack.security.enabled is true by default in ES 8.x; keep default for production
        # For local dev only, can be disabled: xpack.security.enabled: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 512Mi
                  cpu: 250m
                limits:
                  memory: 1Gi
                  cpu: 500m
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms256m -Xmx256m"
          # vm.max_map_count is set to 262144 by Ansible (common role) on all nodes
          # No privileged initContainer needed
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
